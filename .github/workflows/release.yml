name: Release Binaries

on:
  push:
    tags:
      - "mvp-v0.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
            binary_in: target/release/ion.exe
            binary_out: ion-windows-x86_64.exe
          - runner: ubuntu-latest
            os_name: linux
            binary_in: target/release/ion
            binary_out: ion-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Prepare artifact (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary_in }}" "${{ matrix.binary_out }}"

      - name: Prepare artifact (Unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          cp "${{ matrix.binary_in }}" "${{ matrix.binary_out }}"
          chmod +x "${{ matrix.binary_out }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_out }}
          path: ${{ matrix.binary_out }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/ion-windows-x86_64.exe
            dist/**/ion-linux-x86_64
