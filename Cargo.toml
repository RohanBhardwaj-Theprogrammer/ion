[package]
name = "ion"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.42"
inquire = "0.9.1"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.48.0"
toml = "0.9.8"

[dev-dependencies]
assert_fs = "1.1"

[profile.release]
opt-level = 3           # Maximum optimization for speed
lto = "fat"            # Full Link Time Optimization across all crates
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip symbols for smaller binary
panic = "abort"        # Smaller binary, no unwinding
overflow-checks = false # Disable runtime overflow checks for speed
debug = false          # No debug info for smaller binary
rpath = false          # No rpath for smaller binary
incremental = false    # Disable incremental compilation for better optimization

[profile.release.build-override]
opt-level = 3          # Optimize build scripts too

[profile.release.package."*"]
opt-level = 3          # Optimize all dependencies at max level
strip = true           # Strip all dependencies too
